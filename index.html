<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store">
<title>小岛帝国 · 灰盒 Demo（1-1 / 1-2）</title>
<style>
  :root { --panel:#f7f3e8; --border:#3a3a3a; }
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
  body { background:linear-gradient(160deg,#efe8d3,#dcd1b2); font-family:"Microsoft YaHei",sans-serif; display:flex; flex-direction:column; align-items:center; padding:8px; min-height:100vh; box-sizing:border-box; }
  #wrap { width:min(100vw - 20px, calc((100vh - 218px) * 1.5)); }
  #hud { display:flex; gap:13px; background:linear-gradient(#fffdf4,#f2ecD6); border:2px solid var(--border); border-radius:10px; padding:6px 14px; margin-bottom:6px; font-size:15px; align-items:center; box-shadow:0 2px 8px rgba(50,50,30,.15); font-variant-numeric:tabular-nums; }
  #hud b { font-weight:600; }
  #lvName { font-weight:700; color:#7a4a1d; }
  #cards { display:flex; gap:8px; background:linear-gradient(#fffdf4,#f2ecd6); border:2px solid var(--border); border-radius:10px; padding:8px; margin-top:6px; flex-wrap:wrap; box-shadow:0 2px 8px rgba(50,50,30,.15); }
  .card { border:2px solid var(--border); border-radius:8px; background:#fffdf5; padding:6px 10px; cursor:pointer; font-size:13px; text-align:center; min-width:84px; box-shadow:0 1px 4px rgba(50,50,30,.12); transition:transform .08s, background .08s; }
  .card small { display:block; color:#777; margin-top:2px; }
  .card:not(.off):hover { background:#ffe9b8; transform:translateY(-2px); }
  .card.off { opacity:.38; cursor:not-allowed; }
  .card.skill { background:#e8f0ff; }
  #cmds { display:flex; gap:8px; margin-top:6px; }
  .cmd { flex:1; border:2px solid var(--border); border-radius:8px; background:#eef4e2; padding:8px 4px; cursor:pointer; font-size:14px; font-weight:600; box-shadow:0 1px 4px rgba(50,50,30,.12); transition:transform .08s, background .08s; }
  .cmd:hover { background:#dcecc2; transform:translateY(-2px); }
  .cmd:active { transform:translateY(1px); }
  .cmd.atk { background:#fbe4e4; }
  .cmd.atk:hover { background:#f5cfcf; }
  .cmd:active, .card:not(.off):active { transform:translateY(1px); }
  @keyframes cardshake { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-4px); } 75% { transform:translateX(4px); } }
  .shake { animation:cardshake .3s ease; }
  canvas { border:3px solid var(--border); border-radius:12px; display:block; width:100%; height:auto; background:#7ec850; box-shadow:0 8px 22px rgba(35,45,25,.30); filter:saturate(1.07) contrast(1.03); }
  #tip { font-size:12px; color:#666; margin-top:4px; }
  #gearBtn, #fsBtn { border:2px solid var(--border); background:#fffdf5; border-radius:8px; font-size:15px; cursor:pointer; padding:2px 9px; box-shadow:0 1px 3px rgba(50,50,30,.15); }
  #gearBtn:hover, #fsBtn:hover { background:#ffe9b8; }
  #settings { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.35); border-radius:12px; z-index:5; }
  #sPanel { background:linear-gradient(#fffdf4,#f6f0dc); border:3px solid var(--border); border-radius:14px; padding:16px 26px 20px; min-width:320px; box-shadow:0 12px 34px rgba(0,0,0,.40); }
  #sPanel h2 { font-size:18px; margin-bottom:10px; }
  .srow { display:flex; justify-content:space-between; align-items:center; margin:9px 0; font-size:15px; }
  .srow button { min-width:84px; padding:4px 10px; border:2px solid var(--border); border-radius:8px; background:#ffe9b8; cursor:pointer; font-size:14px; }
  #sBtns { margin-top:16px; display:flex; gap:12px; justify-content:center; }
  #sBtns button { padding:8px 20px; border-radius:10px; border:2px solid var(--border); background:#ffd75e; cursor:pointer; font-weight:700; font-size:15px; }
  #tutor { position:absolute; left:50%; top:14px; transform:translateX(-50%); background:rgba(20,20,20,.78); color:#ffe9a8; font-size:16px; font-weight:700; padding:10px 22px; border-radius:12px; border:2px solid #ffd75e; display:none; pointer-events:none; white-space:nowrap; }
  #banner { position:absolute; left:50%; top:34%; transform:translate(-50%,-50%); background:linear-gradient(90deg,rgba(90,20,10,.0),rgba(90,20,10,.82) 18%,rgba(90,20,10,.82) 82%,rgba(90,20,10,.0)); color:#ffd75e; font-size:30px; font-weight:700; letter-spacing:4px; padding:14px 60px; pointer-events:none; opacity:0; white-space:nowrap; text-shadow:2px 3px 0 #3a1000; }
  #banner.show { animation:bnr 2.6s ease forwards; }
  @keyframes bnr { 0% { opacity:0; transform:translate(-50%,-50%) scale(.7); } 12% { opacity:1; transform:translate(-50%,-50%) scale(1.06); } 20% { transform:translate(-50%,-50%) scale(1); } 78% { opacity:1; } 100% { opacity:0; transform:translate(-50%,-52%) scale(1); } }
  #hud b { display:inline-block; transition:none; }
  #hud b.pop { animation:hpop .45s ease; }
  @keyframes hpop { 0% { transform:scale(1.4); color:#e24b4a; } 100% { transform:scale(1); } }
  #overlay { position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; background:rgba(0,0,0,.5); border-radius:12px; }
  #overlay h1 { color:#ffd75e; font-size:44px; text-shadow:2px 3px 0 #5a3a00; margin-bottom:10px; }
  #overlay p { color:#fff; font-size:16px; margin-bottom:16px; }
  #overlay button { font-size:17px; padding:9px 24px; border-radius:10px; border:2px solid #3a3a3a; background:#ffd75e; cursor:pointer; font-weight:700; margin:0 6px; }
  #stage { position:relative; width:100%; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span id="lvName">1-1</span>
    <span>🪵 <b id="rWood">200</b></span>
    <span>🍖 <b id="rFood">200</b></span>
    <span>🪨 <b id="rStone">0</b></span>
    <span>🪙 <b id="rGold">0</b></span>
    <span>👥 <b id="rPop">4/10</b></span>
    <span id="heroCd" style="margin-left:auto;color:#185FA5">旋风斧：就绪</span>
    <span id="nextWave" style="color:#a33;font-weight:700;display:none"></span>
    <button id="gearBtn" title="设置">⚙</button>
    <button id="fsBtn" title="全屏切换">⛶</button>
  </div>
  <div id="stage">
    <canvas id="cv" width="960" height="640"></canvas>
    <div id="banner"></div>
    <div id="tutor"></div>
    <div id="overlay"><h1 id="ovTitle">胜利！</h1><p id="ovText"></p><span id="ovBtns"></span></div>
    <div id="settings"><div id="sPanel">
      <h2>⚙ 设置</h2>
      <div class="srow"><span>游戏速度</span><button id="bSpeed">1x</button></div>
      <div class="srow"><span>音效</span><button id="bSound">开</button></div>
      <div class="srow"><span>伤害飘字</span><button id="bFloats">开</button></div>
      <div class="srow"><span>血条显示</span><button id="bBars">全部</button></div>
      <div class="srow"><span>新手引导</span><button id="bTutor">开</button></div>
      <div id="sBtns"><button id="sReplay">重玩本关</button><button id="sClose">继续游戏</button></div>
    </div></div>
  </div>
  <div id="cards">
    <div class="card" id="cFarmer">造农民<small>🍖50 · 6秒</small></div>
    <div class="card" id="cHouse">民居<small>🪵80 · 人口+5</small></div>
    <div class="card" id="cBarracks">兵营<small>🪵150 · 限1座</small></div>
    <div class="card" id="cArcher">弓手<small>🪵45🪙40 · 射程150</small></div>
    <div class="card" id="cTower">箭塔<small>🪨150 · 攻15/射程180</small></div>
    <div class="card" id="cWall">城墙<small>🪨30 · 封路连放</small></div>
    <div class="card skill" id="cSkill">旋风斧<small>英雄AOE · 12秒CD</small></div>
  </div>
  <div id="cmds">
    <button class="cmd" id="mWood">🪵 [1] 伐木</button>
    <button class="cmd" id="mFood">🍖 [2] 采食</button>
    <button class="cmd" id="mStone">🪨 [3] 采石</button>
    <button class="cmd" id="mGold">🪙 [4] 挖金</button>
    <button class="cmd atk" id="mAtk">⚔ [A] 全军出击</button>
  </div>
  <div id="tip"></div>
</div>
<script>window.addEventListener('error',function(e){var d=document.createElement('div');d.id='ERRBOX';d.style.cssText='position:fixed;top:0;left:0;background:#000;color:#f44;z-index:9999;font-size:20px;white-space:pre-wrap;padding:12px';d.textContent='ERR: '+e.message+' @ '+(e.filename||'')+':'+e.lineno;document.body.appendChild(d);});</script>
<script type="module" src="scripts/main.js"></script>
</body>
</html>
