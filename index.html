<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store">
<title>小岛帝国 · 灰盒 Demo（1-1 / 1-2）</title>
<style>
  :root { --panel:#f7f3e8; --border:#3a3a3a; }
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
  body { background:linear-gradient(160deg,#efe8d3,#dcd1b2); font-family:"Microsoft YaHei",sans-serif; display:flex; flex-direction:column; align-items:center; padding:8px; min-height:100vh; box-sizing:border-box; }
  #wrap { width:min(100vw - 20px, calc((100vh - 218px) * 1.5)); }
  #hud { display:flex; gap:13px; background:linear-gradient(#fffdf4,#f2ecD6); border:2px solid var(--border); border-radius:10px; padding:6px 14px; margin-bottom:6px; font-size:15px; align-items:center; box-shadow:0 2px 8px rgba(50,50,30,.15); font-variant-numeric:tabular-nums; }
  #hud b { font-weight:600; }
  #lvName { font-weight:700; color:#7a4a1d; }
  #cards { display:flex; gap:8px; background:linear-gradient(#fffdf4,#f2ecd6); border:2px solid var(--border); border-radius:10px; padding:8px; margin-top:6px; flex-wrap:wrap; box-shadow:0 2px 8px rgba(50,50,30,.15); }
  .card { border:2px solid var(--border); border-radius:8px; background:#fffdf5; padding:6px 10px; cursor:pointer; font-size:13px; text-align:center; min-width:84px; box-shadow:0 1px 4px rgba(50,50,30,.12); transition:transform .08s, background .08s; }
  .card small { display:block; color:#777; margin-top:2px; }
  .card:not(.off):hover { background:#ffe9b8; transform:translateY(-2px); }
  .card.off { opacity:.38; cursor:not-allowed; }
  .card.skill { background:#e8f0ff; }
  #cmds { display:flex; gap:8px; margin-top:6px; }
  .cmd { flex:1; border:2px solid var(--border); border-radius:8px; background:#eef4e2; padding:8px 4px; cursor:pointer; font-size:14px; font-weight:600; box-shadow:0 1px 4px rgba(50,50,30,.12); transition:transform .08s, background .08s; }
  .cmd:hover { background:#dcecc2; transform:translateY(-2px); }
  .cmd:active { transform:translateY(1px); }
  .cmd.atk { background:#fbe4e4; }
  .cmd.atk:hover { background:#f5cfcf; }
  .cmd:active, .card:not(.off):active { transform:translateY(1px); }
  @keyframes cardshake { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-4px); } 75% { transform:translateX(4px); } }
  .shake { animation:cardshake .3s ease; }
  canvas { border:3px solid var(--border); border-radius:12px; display:block; width:100%; height:auto; background:#7ec850; box-shadow:0 8px 22px rgba(35,45,25,.30); filter:saturate(1.07) contrast(1.03); }
  #tip { font-size:12px; color:#666; margin-top:4px; }
  #gearBtn, #fsBtn { border:2px solid var(--border); background:#fffdf5; border-radius:8px; font-size:15px; cursor:pointer; padding:2px 9px; box-shadow:0 1px 3px rgba(50,50,30,.15); }
  #gearBtn:hover, #fsBtn:hover { background:#ffe9b8; }
  #settings { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.35); border-radius:12px; z-index:5; }
  #sPanel { background:linear-gradient(#fffdf4,#f6f0dc); border:3px solid var(--border); border-radius:14px; padding:16px 26px 20px; min-width:320px; box-shadow:0 12px 34px rgba(0,0,0,.40); }
  #sPanel h2 { font-size:18px; margin-bottom:10px; }
  .srow { display:flex; justify-content:space-between; align-items:center; margin:9px 0; font-size:15px; }
  .srow button { min-width:84px; padding:4px 10px; border:2px solid var(--border); border-radius:8px; background:#ffe9b8; cursor:pointer; font-size:14px; }
  #sBtns { margin-top:16px; display:flex; gap:12px; justify-content:center; }
  #sBtns button { padding:8px 20px; border-radius:10px; border:2px solid var(--border); background:#ffd75e; cursor:pointer; font-weight:700; font-size:15px; }
  #tutor { position:absolute; left:50%; top:14px; transform:translateX(-50%); background:rgba(20,20,20,.78); color:#ffe9a8; font-size:16px; font-weight:700; padding:10px 22px; border-radius:12px; border:2px solid #ffd75e; display:none; pointer-events:none; white-space:nowrap; }
  #banner { position:absolute; left:50%; top:34%; transform:translate(-50%,-50%); background:linear-gradient(90deg,rgba(90,20,10,.0),rgba(90,20,10,.82) 18%,rgba(90,20,10,.82) 82%,rgba(90,20,10,.0)); color:#ffd75e; font-size:30px; font-weight:700; letter-spacing:4px; padding:14px 60px; pointer-events:none; opacity:0; white-space:nowrap; text-shadow:2px 3px 0 #3a1000; }
  #banner.show { animation:bnr 2.6s ease forwards; }
  @keyframes bnr { 0% { opacity:0; transform:translate(-50%,-50%) scale(.7); } 12% { opacity:1; transform:translate(-50%,-50%) scale(1.06); } 20% { transform:translate(-50%,-50%) scale(1); } 78% { opacity:1; } 100% { opacity:0; transform:translate(-50%,-52%) scale(1); } }
  #hud b { display:inline-block; transition:none; }
  #hud b.pop { animation:hpop .45s ease; }
  @keyframes hpop { 0% { transform:scale(1.4); color:#e24b4a; } 100% { transform:scale(1); } }
  #overlay { position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; background:rgba(0,0,0,.5); border-radius:12px; }
  #overlay h1 { color:#ffd75e; font-size:44px; text-shadow:2px 3px 0 #5a3a00; margin-bottom:10px; }
  #overlay p { color:#fff; font-size:16px; margin-bottom:16px; }
  #overlay button { font-size:17px; padding:9px 24px; border-radius:10px; border:2px solid #3a3a3a; background:#ffd75e; cursor:pointer; font-weight:700; margin:0 6px; }
  #stage { position:relative; width:100%; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span id="lvName">1-1</span>
    <span>🪵 <b id="rWood">200</b></span>
    <span>🍖 <b id="rFood">200</b></span>
    <span>🪨 <b id="rStone">0</b></span>
    <span>🪙 <b id="rGold">0</b></span>
    <span>👥 <b id="rPop">4/10</b></span>
    <span id="heroCd" style="margin-left:auto;color:#185FA5">旋风斧：就绪</span>
    <span id="nextWave" style="color:#a33;font-weight:700;display:none"></span>
    <button id="gearBtn" title="设置">⚙</button>
    <button id="fsBtn" title="全屏切换">⛶</button>
  </div>
  <div id="stage">
    <canvas id="cv" width="960" height="640"></canvas>
    <div id="banner"></div>
    <div id="tutor"></div>
    <div id="overlay"><h1 id="ovTitle">胜利！</h1><p id="ovText"></p><span id="ovBtns"></span></div>
    <div id="settings"><div id="sPanel">
      <h2>⚙ 设置</h2>
      <div class="srow"><span>游戏速度</span><button id="bSpeed">1x</button></div>
      <div class="srow"><span>音效</span><button id="bSound">开</button></div>
      <div class="srow"><span>伤害飘字</span><button id="bFloats">开</button></div>
      <div class="srow"><span>血条显示</span><button id="bBars">全部</button></div>
      <div class="srow"><span>新手引导</span><button id="bTutor">开</button></div>
      <div id="sBtns"><button id="sReplay">重玩本关</button><button id="sClose">继续游戏</button></div>
    </div></div>
  </div>
  <div id="cards">
    <div class="card" id="cFarmer">造农民<small>🍖50 · 6秒</small></div>
    <div class="card" id="cHouse">民居<small>🪵80 · 人口+5</small></div>
    <div class="card" id="cBarracks">兵营<small>🪵150 · 限1座</small></div>
    <div class="card" id="cArcher">弓手<small>🪵45🪙40 · 射程150</small></div>
    <div class="card" id="cTower">箭塔<small>🪨150 · 攻15/射程180</small></div>
    <div class="card" id="cWall">城墙<small>🪨30 · 封路连放</small></div>
    <div class="card skill" id="cSkill">旋风斧<small>英雄AOE · 12秒CD</small></div>
  </div>
  <div id="cmds">
    <button class="cmd" id="mWood">🪵 [1] 伐木</button>
    <button class="cmd" id="mFood">🍖 [2] 采食</button>
    <button class="cmd" id="mStone">🪨 [3] 采石</button>
    <button class="cmd" id="mGold">🪙 [4] 挖金</button>
    <button class="cmd atk" id="mAtk">⚔ [A] 全军出击</button>
  </div>
  <div id="tip"></div>
</div>
<script>
"use strict";
// ============ 数值表（对应策划案 v1.0）============
const CFG = {
  farmer:  { hp:60,  atk:3,  as:1.0, rng:24,  spd:60, pop:1 },
  archer:  { hp:100, atk:10, as:0.8, rng:150, spd:70, pop:1 },
  hero:    { hp:500, atk:25, as:0.8, rng:30,  spd:90, pop:0 },
  wolf:    { hp:80,  atk:5,  as:1.0, rng:26,  spd:80 },
  cultist: { hp:90,  atk:8,  as:1.0, rng:26,  spd:55 },
  tower:   { hp:800, atk:15, as:1.2, rng:180 },
  wall:    { hp:900 },
  cost: { farmer:{food:50}, house:{wood:80}, barracks:{wood:150}, archer:{wood:45,gold:40}, tower:{stone:150}, wall:{stone:30} },
  buildTime: { farmer:6, house:10, barracks:15, archer:9, tower:20, wall:4 },
  gatherTrip: 4, gatherAmt: 12,
  whirlR: 100, whirlDmg: 120, whirlCD: 12,
};
const W=960, H=640;
const WW=1536, WH=1024, GS=64, GW=24, GH=16;
const RIVER_X=14, BRIDGE_ROWS=[7,8];
const MOUNTAINS=[[16,3],[17,3],[16,4],[17,4],[16,11],[17,11],[16,12],[17,12],[4,12],[5,12],[4,13],[3,2],[4,2]];
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
const DPR=Math.min(window.devicePixelRatio||1,2);
cv.width=W*DPR; cv.height=H*DPR;
ctx.setTransform(DPR,0,0,DPR,0,0);
ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality="high";
const cam={x:0,y:0};
const keys={};
let grid=[], roadSet=new Set();
function buildGrid(){
  grid=[];
  for(let y=0;y<GH;y++){ const row=[];
    for(let x=0;x<GW;x++){ let b=0;
      if(x===RIVER_X&&!BRIDGE_ROWS.includes(y)) b=1;
      for(const m of MOUNTAINS) if(m[0]===x&&m[1]===y) b=1;
      row.push(b); }
    grid.push(row); }
  for(const b of buildings){ const gx=Math.floor(b.x/GS), gy=Math.floor(b.y/GS);
    if(gx>=0&&gy>=0&&gx<GW&&gy<GH) grid[gy][gx]=1; }
  for(const n of nodes){ if(n.amt<=0) continue;
    const gx=Math.floor(n.x/GS), gy=Math.floor(n.y/GS);
    if(gx>=0&&gy>=0&&gx<GW&&gy<GH) grid[gy][gx]=1; }
  for(const e of enemies){ if(e.kind==="cultist") e.path=null; }
}
function astar(sgx,sgy,tgx,tgy){
  if(sgx<0||sgy<0||sgx>=GW||sgy>=GH) return null;
  if(grid[tgy]&&grid[tgy][tgx]===1){
    const alts=[[tgx+1,tgy],[tgx-1,tgy],[tgx,tgy+1],[tgx,tgy-1]].filter(([x,y])=>x>=0&&y>=0&&x<GW&&y<GH&&grid[y][x]===0);
    if(!alts.length) return null;
    alts.sort((a,b)=>dist2(a[0]*GS+32,a[1]*GS+32,sgx*GS+32,sgy*GS+32)-dist2(b[0]*GS+32,b[1]*GS+32,sgx*GS+32,sgy*GS+32));
    tgx=alts[0][0]; tgy=alts[0][1];
  }
  const open=[[sgx,sgy]], came={}, gs={}, fs={};
  const sk=sgx+","+sgy; gs[sk]=0; fs[sk]=Math.abs(tgx-sgx)+Math.abs(tgy-sgy);
  let guard=0;
  while(open.length&&guard++<2000){
    let bi=0;
    for(let i=1;i<open.length;i++){ const a=open[i][0]+","+open[i][1], b=open[bi][0]+","+open[bi][1];
      if((fs[a]||1e9)<(fs[b]||1e9)) bi=i; }
    const cur=open.splice(bi,1)[0], ck=cur[0]+","+cur[1];
    if(cur[0]===tgx&&cur[1]===tgy){
      const path=[]; let k=ck;
      while(k){ const p=k.split(","), x=+p[0], y=+p[1]; path.unshift({x:x*GS+32,y:y*GS+32}); k=came[k]; }
      return path;
    }
    for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=cur[0]+d[0], ny=cur[1]+d[1];
      if(nx<0||ny<0||nx>=GW||ny>=GH||grid[ny][nx]===1) continue;
      const ng=(gs[ck]||0)+(roadSet.has(nx+","+ny)?0.6:1), nk=nx+","+ny;
      if(gs[nk]===undefined||ng<gs[nk]){ gs[nk]=ng; came[nk]=ck;
        fs[nk]=ng+Math.abs(tgx-nx)+Math.abs(tgy-ny);
        if(!open.some(o=>o[0]===nx&&o[1]===ny)) open.push([nx,ny]); }
    }
  }
  return null;
}
function worldPath(x1,y1,x2,y2){
  const p=astar(Math.floor(x1/GS),Math.floor(y1/GS),Math.floor(x2/GS),Math.floor(y2/GS));
  if(p&&p.length) p[p.length-1]={x:x2,y:y2};
  return p;
}
function followPath(u,dt){
  while(u.path&&u.pi<u.path.length&&dist2(u.x,u.y,u.path[u.pi].x,u.path[u.pi].y)<22) u.pi++;
  if(!u.path||u.pi>=u.path.length) return true;
  moveTo(u,u.path[u.pi].x,u.path[u.pi].y,dt,0);
  return false;
}
// 暗角（一次性离屏）
const vig=document.createElement("canvas"); vig.width=W; vig.height=H;
{ const c=vig.getContext("2d");
  const g=c.createRadialGradient(W/2,H/2,H*0.40,W/2,H/2,H*0.80);
  g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(1,"rgba(18,24,16,0.14)");
  c.fillStyle=g; c.fillRect(0,0,W,H); }
// 世界地形层（河/桥/山/道路，一次性离屏 1536×1024）
const terrainC=document.createElement("canvas"); terrainC.width=WW; terrainC.height=WH;
{ const c=terrainC.getContext("2d");
  c.fillStyle="#4a9ac2"; c.fillRect(RIVER_X*GS,0,GS,WH);
  c.strokeStyle="rgba(255,255,255,.28)"; c.lineWidth=3;
  for(let y=24;y<WH;y+=60){ c.beginPath(); c.moveTo(RIVER_X*GS+8,y); c.quadraticCurveTo(RIVER_X*GS+32,y+10,RIVER_X*GS+56,y); c.stroke(); }
  c.fillStyle="#a8783c"; c.fillRect(RIVER_X*GS-6,BRIDGE_ROWS[0]*GS,GS+12,BRIDGE_ROWS.length*GS);
  c.strokeStyle="#6a4a20"; c.lineWidth=3;
  for(let y=BRIDGE_ROWS[0]*GS+12;y<BRIDGE_ROWS[0]*GS+BRIDGE_ROWS.length*GS;y+=16){
    c.beginPath(); c.moveTo(RIVER_X*GS-6,y); c.lineTo(RIVER_X*GS+GS+6,y); c.stroke(); }
  c.fillStyle="#6a4a20"; c.fillRect(RIVER_X*GS-10,BRIDGE_ROWS[0]*GS,6,BRIDGE_ROWS.length*GS); c.fillRect(RIVER_X*GS+GS+4,BRIDGE_ROWS[0]*GS,6,BRIDGE_ROWS.length*GS);
  let rseed=913; const rr2=()=>{ rseed=(rseed*9301+49297)%233280; return rseed/233280; };
  c.lineCap="round";
  const paths=[ [[23,2],[19,2],[18,5],[15,5],[15,7],[13,7],[3,7]],
                [[23,13],[19,13],[15,13],[13,10],[13,8],[3,8]] ];
  for(const pts of paths){
    for(let i=0;i<pts.length-1;i++){
      const x1=pts[i][0]*GS+32, y1=pts[i][1]*GS+32, x2=pts[i+1][0]*GS+32, y2=pts[i+1][1]*GS+32;
      const len=Math.hypot(x2-x1,y2-y1), steps=Math.ceil(len/13);
      for(let s2=0;s2<=steps;s2++){
        const t=s2/steps, x=x1+(x2-x1)*t, y=y1+(y2-y1)*t, r=16+rr2()*7;
        c.fillStyle=(s2+i)%2?"rgba(158,126,72,.95)":"rgba(146,114,62,.95)";
        c.beginPath(); c.arc(x,y,r,0,7); c.fill();
      }
    }
    c.strokeStyle="rgba(198,166,110,.9)"; c.lineWidth=20;
    c.beginPath(); pts.forEach((p,i)=>{ const x=p[0]*GS+32,y=p[1]*GS+32; i?c.lineTo(x,y):c.moveTo(x,y); }); c.stroke();
    c.setLineDash([4,30]); c.strokeStyle="rgba(118,94,52,.55)"; c.lineWidth=3; c.stroke(); c.setLineDash([]);
    for(let i=0;i<pts.length-1;i++){
      const x1=pts[i][0]*GS+32, y1=pts[i][1]*GS+32, x2=pts[i+1][0]*GS+32, y2=pts[i+1][1]*GS+32;
      const len=Math.hypot(x2-x1,y2-y1), steps=Math.ceil(len/24);
      const dx=(x2-x1)/len, dy=(y2-y1)/len;
      for(let s2=1;s2<steps;s2++){
        const x=x1+(x2-x1)*s2/steps, y=y1+(y2-y1)*s2/steps;
        for(const sgn of [-1,1]){
          const off=20+rr2()*9, px=x-dy*off*sgn, py=y+dx*off*sgn;
          if(rr2()<0.55){
            c.strokeStyle="rgba(40,110,40,"+(0.5+rr2()*0.3).toFixed(2)+")"; c.lineWidth=1.8;
            for(let k=-1;k<=1;k++){ c.beginPath(); c.moveTo(px+k*2.2,py); c.quadraticCurveTo(px+k*3,py-4,px+k*3.8,py-7); c.stroke(); }
          } else {
            c.fillStyle="rgba(150,140,120,.8)"; c.beginPath(); c.ellipse(px,py,2.5+rr2()*2,1.8+rr2()*1.4,rr2()*3,0,7); c.fill();
          }
        }
      }
    }
    for(let i=0;i<pts.length-1;i++){ const [x1,y1]=pts[i],[x2,y2]=pts[i+1];
      const steps=Math.max(Math.abs(x2-x1),Math.abs(y2-y1))*2;
      for(let s2=0;s2<=steps;s2++) roadSet.add(Math.round(x1+(x2-x1)*s2/steps)+","+Math.round(y1+(y2-y1)*s2/steps)); }
  } }
function drawMountains(){ const c=terrainC.getContext("2d"); const m=IMGS["19_mountain"]; if(!m)return;
  for(let i=0;i<MOUNTAINS.length;i++){ const [mx,my]=MOUNTAINS[i];
    const cx=mx*GS+32, cy=my*GS+GS-4, s=i%2?84:76;
    c.drawImage(m,cx-s/2,cy-s,s,s); } }
// 色阶层（世界尺寸）
const ground2=document.createElement("canvas"); ground2.width=WW; ground2.height=WH;
{ const c=ground2.getContext("2d");
  let seed=777; const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  for(let i=0;i<64;i++){ c.fillStyle="rgba(36,108,28,"+(0.05+rnd()*0.05).toFixed(2)+")";
    c.beginPath(); c.ellipse(rnd()*WW,rnd()*WH,60+rnd()*90,40+rnd()*60,rnd()*3,0,7); c.fill(); }
  for(let i=0;i<50;i++){ c.fillStyle="rgba(196,232,124,"+(0.05+rnd()*0.06).toFixed(2)+")";
    c.beginPath(); c.ellipse(rnd()*WW,rnd()*WH,50+rnd()*80,35+rnd()*55,rnd()*3,0,7); c.fill(); }
  for(let i=0;i<25;i++){ c.fillStyle="rgba(152,122,70,"+(0.04+rnd()*0.04).toFixed(2)+")";
    c.beginPath(); c.ellipse(rnd()*WW,rnd()*WH,40+rnd()*60,25+rnd()*40,rnd()*3,0,7); c.fill(); } }
// 装饰层（世界尺寸，避开河带）
const deco=document.createElement("canvas"); deco.width=WW; deco.height=WH;
{ const c=deco.getContext("2d");
  let seed=4224; const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  c.lineCap="round";
  for(let i=0;i<240;i++){ const x=48+rnd()*(WW-96), y=52+rnd()*(WH-104); if(x>872&&x<984) continue;
    c.strokeStyle="rgba(30,86,26,"+(0.22+rnd()*0.26).toFixed(2)+")"; c.lineWidth=1.7;
    for(let k=-1;k<=1;k++){ c.beginPath(); c.moveTo(x+k*2.4,y); c.quadraticCurveTo(x+k*3.4,y-5,x+k*4.4,y-9); c.stroke(); } }
  for(let i=0;i<66;i++){ const x=52+rnd()*(WW-104), y=56+rnd()*(WH-112); if(x>872&&x<984) continue;
    const col=rnd()>0.5?"255,255,255":"255,214,80";
    c.fillStyle="rgba("+col+",0.9)";
    for(let p=0;p<5;p++){ const a=p/5*Math.PI*2+rnd(); c.beginPath(); c.arc(x+Math.cos(a)*2.8,y+Math.sin(a)*2.8,1.7,0,7); c.fill(); }
    c.fillStyle="rgba(255,150,40,.95)"; c.beginPath(); c.arc(x,y,1.5,0,7); c.fill(); }
  for(let i=0;i<40;i++){ const x=56+rnd()*(WW-112), y=60+rnd()*(WH-120); if(x>872&&x<984) continue;

function legalSpot(x,y){

  if(gx<0||gy<0||gx>=GW||gy>=GH||grid[gy][gx]===1) return false;
  for(const b of buildings){ if(dist2(x,y,b.x,b.y)<58) return false; }

  const gx0=Math.max(1,Math.min(GW-2,Math.round(nx/GS))), gy0=Math.max(1,Math.min(GH-2,Math.round(ny/GS)));
  if(legalSpot(gx0*GS+32,gy0*GS+32)) return {x:gx0*GS+32,y:gy0*GS+32};
  for(let r=1;r<=6;r++){
    for(let a=0;a<8;a++){
      const gx=gx0+Math.round(Math.cos(a*Math.PI/4)*r), gy=gy0+Math.round(Math.sin(a*Math.PI/4)*r);
      if(gx<1||gy<1||gx>=GW-1||gy>=GH-1) continue;
      if(legalSpot(gx*GS+32,gy*GS+32)) return {x:gx*GS+32,y:gy*GS+32};
    }
  }
  return null;
}

function update(dt){
  if(gameOver) return;
  const ms=640*dt;
  if(keys["arrowleft"])cam.x-=ms; if(keys["arrowright"])cam.x+=ms;
  if(keys["arrowup"])cam.y-=ms; if(keys["arrowdown"])cam.y+=ms;
  clampCam();
  if(heroCd>0) heroCd=Math.max(0,heroCd-dt);
  // 波次（1-2）
  const L=LEVELS[level];
  if(L.waves && waveIdx<L.waves.length){
    waveT+=dt;
    if(waveT>=L.waves[waveIdx].at){
      const wv=L.waves[waveIdx]; waveIdx++;
      banner("—— 第 "+waveIdx+" 波教徒来袭 ——");
      const side=waveIdx%2, sy0=side?840:130;
      (wv.c||[]).forEach((n,i)=>{ for(let k=0;k<n;k++) enemies.push(makeEnemy("cultist",1520,sy0+i*26+k*30)); });
      (wv.w||[]).forEach((n,i)=>{ for(let k=0;k<n;k++) enemies.push(makeEnemy("wolf",1520,sy0+140+k*70)); });
    }
  }
  // 建造队列
  for(const q of [...buildQ]){
    q.timer+=dt;
    if(q.timer>=q.total){
      buildQ.splice(buildQ.indexOf(q),1);
      if(selectedQ===q) selectedQ=null;
      sfx("build");
      spawnParts(q.x,q.y-16,12,"#cfc8b8",110,160,0.8,3.4);
      if(q.type==="house"){ addBuilding("house",q.x,q.y); popCap+=5; addFloat(q.x,q.y-40,"人口+5","#2a7"); }
      else if(q.type==="barracks"){ addBuilding("barracks",q.x,q.y); addFloat(q.x,q.y-50,"兵营建成！","#185FA5"); }
      else if(q.type==="tower"){ addBuilding("tower",q.x,q.y); addFloat(q.x,q.y-50,"箭塔建成！","#185FA5"); }
      else spawnUnit(q.type,q.x,q.y);
    }
  }
  // 我方单位
  for(const u of [...units]){
    u.animT+=dt; u.moving=false; if(u.atkT>0) u.atkT-=dt;
    if(u.lungeT>0) u.lungeT-=dt; if(u.hurtT>0) u.hurtT-=dt; if(u.atkPulseT>0) u.atkPulseT-=dt;
    if(u.hp<=0){ units.splice(units.indexOf(u),1); selList=selList.filter(x=>x!==u); sfx("die_ally"); addFloat(u.x,u.y,"阵亡…","#555"); continue; }
    if(u.state==="move"&&u.dest){
      if(!u.path){ u.path=worldPath(u.x,u.y,u.dest.x,u.dest.y); u.pi=0; }
      if(u.path){ const done=followPath(u,dt);
        if(done||dist2(u.x,u.y,u.dest.x,u.dest.y)<8){ u.state="idle"; u.dest=null; u.path=null; } }
      else { moveTo(u,u.dest.x,u.dest.y,dt,0); if(dist2(u.x,u.y,u.dest.x,u.dest.y)<6){u.state="idle";u.dest=null;} }
    }
    else if(u.state==="gather"&&u.node){
      if(u.node.amt<=0){ const nx=nearestNode(u.node.kind,u);
        if(nx){ u.node=nx; u.gT=0; u.path=null; addFloat(u.x,u.y-38,"转移采集","#185FA5"); }
        else { u.node=null; u.state="idle"; addFloat(u.x,u.y-38,"资源采尽","#888"); }
        continue; }
      if(!u.path){ u.path=worldPath(u.x,u.y,u.node.x,u.node.y); u.pi=0; }
      if(u.path&&u.pi<u.path.length){ followPath(u,dt); }
      else if(dist2(u.x,u.y,u.node.x,u.node.y)>60){ u.path=null; moveTo(u,u.node.x,u.node.y,dt,0); }
      else { u.gT+=dt; if(u.gT>=CFG.gatherTrip){ u.gT=0; const take=Math.min(CFG.gatherAmt,u.node.amt); u.node.amt-=take;
        const map={wood:["wood","木","#7a4a1d"],food:["food","食","#2a7a2a"],stone:["stone","石","#556"],gold:["gold","金","#a8821c"]};
        const m=map[u.node.kind]; res[m[0]]+=take; addFloat(u.x,u.y-40,"+"+take+" "+m[1],m[2]);
        if(u.node.amt<=0) addFloat(u.node.x,u.node.y-30,"枯竭","#888"); sfx("gather");
        spawnParts(u.x,u.y-14,8,PARTCOL[u.node.kind]||"#fff",90,240,0.55,3.2); } }
    }
    else if(u.state==="idle"&&!u.dest){
      u.scanT=(u.scanT||0)+dt;
      if(u.scanT>0.3){ u.scanT=0; const nx=autoAcquire(u); if(nx){ u.target=nx; u.state="attack"; } }
    }
    else if(u.state==="attack"&&u.target){
      if(u.target.hp<=0){ const nx=autoAcquire(u);
        if(nx){ u.target=nx; } else { u.state="idle"; u.target=null; } continue; }
      if(dist2(u.x,u.y,u.target.x,u.target.y)>u.rng+14) moveTo(u,u.target.x,u.target.y,dt,0);
      else if(u.atkT<=0){ u.atkT=u.as;
        const ranged=u.rng>60;
        if(ranged) projs.push({x:u.x,y:u.y-24,x2:u.target.x,y2:u.target.y-20,t:0});
        hitFx(u,u.target,ranged);
        u.target.hp-=u.atk; addFloat(u.target.x,u.target.y-34,"-"+u.atk,"#e24B4A");
        if(u.target.hp<=0) onEnemyDead(u.target); }
    }
  }
  // 塔攻击
  for(const b of buildings){ if(b.type!=="tower"||b.hp<=0) continue;
    if(b.atkT>0) b.atkT-=dt;
    let near=null,nd=b.rng;
    for(const e of enemies){ const d=dist2(b.x,b.y-60,e.x,e.y); if(d<nd){nd=d;near=e;} }
    if(near&&b.atkT<=0){ b.atkT=b.as; projs.push({x:b.x,y:b.y-70,x2:near.x,y2:near.y-20,t:0});
      hitFx(null,near,true); sfx("tower_shot");
      near.hp-=b.atk; addFloat(near.x,near.y-34,"-"+b.atk,"#e24B4A"); if(near.hp<=0) onEnemyDead(near); }
  }
  // 建筑损毁
  for(const b of [...buildings]){ if(b.hp<=0){ buildings.splice(buildings.indexOf(b),1); buildGrid(); sfx("building_down"); addFloat(b.x,b.y-30,"建筑被毁！","#d33");
    if(b.type==="townhall"){ gameOver=true; sfx("lose"); showOverlay("主城陷落…","第 "+level+" 关失败。教徒烧了主城。","重玩本关","retryLevel()"); return; } } }
  // 农民保护 / 英雄复活
  if(!units.some(u=>u.type==="farmer")){ rescueT+=dt; if(rescueT>15){ rescueT=0; spawnUnit("farmer",220,500); addFloat(220,470,"主城补员 +1","#185FA5"); } } else rescueT=0;
  if(!units.some(u=>u.type==="hero")){ heroRevT+=dt; if(heroRevT>60){ heroRevT=0; spawnUnit("hero",180,480); addFloat(180,450,"英雄归队！","#185FA5"); } } else heroRevT=0;
  // 敌人
  for(const e of [...enemies]){
    if(e.hp<=0){ onEnemyDead(e); continue; }
    if(e.atkT>0) e.atkT-=dt;
    e.moving=false;
    if(e.lungeT>0) e.lungeT-=dt; if(e.hurtT>0) e.hurtT-=dt; if(e.atkPulseT>0) e.atkPulseT-=dt;
    const home=buildings.find(b=>b.type==="townhall");
    if(e.kind==="wolf"){
      if(e.state==="attack"&&e.target){
        if(e.target.hp<=0||(e.target.team&&e.target.team!=="P")){ e.state="idle"; e.target=null; continue; }
        if(dist2(e.x,e.y,e.target.x,e.target.y)>e.rng+12) moveTo(e,e.target.x,e.target.y,dt,0);
        else if(e.atkT<=0){ e.atkT=e.as; hitFx(e,e.target,false); e.target.hp-=e.atk; addFloat(e.target.x,e.target.y-34,"-"+e.atk,"#e24B4A"); }
      } else {
        let near=null,nd=150;
        for(const u of units){ const d=dist2(e.x,e.y,u.x,u.y); if(d<nd){nd=d;near=u;} }
        if(near){ e.state="attack"; e.target=near; }
        else { e.wT-=dt; if(e.wT<=0){ e.wT=rnd(1.5,3.5); e.dest={x:e.hx+rnd(-70,70),y:e.hy+rnd(-50,50)}; }
          if(e.dest){ moveTo(e,e.dest.x,e.dest.y,dt,20); if(dist2(e.x,e.y,e.dest.x,e.dest.y)<4) e.dest=null; } }
      }
    } else {
      if(e.state==="attack"&&e.target){
        if(e.target.hp<=0){ e.state="march"; e.target=null; e.path=null; continue; }
        if(dist2(e.x,e.y,e.target.x,e.target.y)>e.rng+(e.target.w?e.target.w/2+6:14)) moveTo(e,e.target.x,e.target.y,dt,0);
        else if(e.atkT<=0){ e.atkT=e.as; hitFx(e,e.target,false); e.target.hp-=e.atk; shake(2.2);
          addFloat(e.target.x,e.target.y-(e.target.w?70:34),"-"+e.atk,"#e24B4A"); }
      } else {
        let near=null,nd=130;
        for(const u of units){ const d=dist2(e.x,e.y,u.x,u.y); if(d<nd){nd=d;near=u;} }
        for(const b of buildings){ if(b.type!=="tower") continue; const d=dist2(e.x,e.y,b.x,b.y); if(d<nd){nd=d;near=b;} }
        if(near){ e.state="attack"; e.target=near; }
        else {
          if(!e.path||e.pi>=e.path.length){
            if(!home) continue;
            e.path=worldPath(e.x,e.y,home.x,home.y); e.pi=0;
            if(!e.path){
              let wb=null,wd=1e9;
              for(const b of buildings){ if(b.type!=="wall")continue; const d=dist2(e.x,e.y,b.x,b.y); if(d<wd){wd=d;wb=b;} }
              if(wb){ e.state="attack"; e.target=wb; }
              else { e.path=null; moveTo(e,home.x,home.y,dt,0); }
              continue;
            }
          }
          const done=followPath(e,dt);
          if(done){ e.path=null;
            if(home&&dist2(e.x,e.y,home.x,home.y)<e.rng+70){ e.state="attack"; e.target=home; } }
        }
      }
    }
  }
  // 特效
  for(const f of [...floats]){ f.t+=dt; f.y-=28*dt; if(f.t>1.1) floats.splice(floats.indexOf(f),1); }
  for(const p of [...projs]){ p.t+=dt*6; if(p.t>=1) projs.splice(projs.indexOf(p),1); }
  for(const s of [...slashFx]){ s.t+=dt*7; if(s.t>=1) slashFx.splice(slashFx.indexOf(s),1); }
  for(const p of [...parts]){ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.g*dt; if(p.t>=p.life) parts.splice(parts.indexOf(p),1); }
  for(const s of [...sparkles]){ s.t+=dt; if(s.t>0.9) sparkles.splice(sparkles.indexOf(s),1); }
  for(const m of [...moveMarks]){ m.t+=dt; if(m.t>0.5) moveMarks.splice(moveMarks.indexOf(m),1); }
  if(shakeT>0){ shakeT-=dt; if(shakeT<=0) shakeAmp=0; }
  for(const a of [...announceQ]){ a.t+=dt; if(a.t>2.4) announceQ.splice(announceQ.indexOf(a),1); }
  // 胜利
  if(!winFlag && !gameOver){
    const win = L.waves ? (waveIdx>=L.waves.length && enemies.length===0) : L.winCheck();
    if(win && units.some(u=>u.team==="P")){ winFlag=true;
      const secs=Math.round((performance.now()-t0)/1000);
      setTimeout(()=>{ if(gameOver)return; gameOver=true; sfx("win");
        const next = level===1 ? ["进入 1-2 月夜突袭","nextLevel()"] : ["M2 演示通关！","nextLevel()"];
        showOverlay("胜利！", "用时 "+secs+" 秒 · 斩杀 "+killed+" 名敌人", next[0], next[1]); },600);
    }
  }
}
// 自动索敌：战斗单位视野内最近敌人（农民不参战）
function autoAcquire(u){
  if(u.type==="farmer") return null;
  let near=null, nd=u.rng+80;
  for(const e of enemies){ if(e.hp<=0)continue; const d=dist2(u.x,u.y,e.x,e.y); if(d<nd){nd=d;near=e;} }
  return near;
}
// 最近同类资源点：软负载均衡（已被越多农民占的节点罚距越大）
function nearestNode(kind,u){
  const cnt={};
  for(const u2 of units){ if(u2.type==="farmer"&&u2.state==="gather"&&u2.node&&u2.node.kind===kind)
    cnt[u2.node]=(cnt[u2.node]||0)+1; }
  let best=null,bd=1e9;
  for(const n of nodes){ if(n.amt<=0||n.kind!==kind) continue;
    const d=dist2(u.x,u.y,n.x,n.y)+(cnt[n]||0)*900;
    if(d<bd){bd=d;best=n;} }
  return best;
}
function onEnemyDead(e){ const i=enemies.indexOf(e); if(i>=0)enemies.splice(i,1); killed++;
  shake(3.6); sfx("die_enemy");
  spawnParts(e.x,e.y-14,14,"#8a8a94",150,200,0.7,3.6);
  addFloat(e.x,e.y-20,e.kind==="wolf"?"野狼被消灭！":"教徒倒下！","#d33");
  for(const u of units){ if(u.target===e){ const nx=autoAcquire(u);
    if(nx){ u.target=nx; u.state="attack"; } else { u.target=null; u.state="idle"; } } } }
// 攻击表现：近战突刺+挥砍弧光 / 远程后坐 + 受击闪白
function hitFx(att,tgt,ranged){
  if(att){ const dx=tgt.x-att.x, dy=tgt.y-att.y, d=Math.hypot(dx,dy)||1;
    att.lungeT=0.18; att.lungeDx=(ranged?-dx/d*5:dx/d*11); att.lungeDy=(ranged?-dy/d*5:dy/d*11); att.atkPulseT=0.18; }
  tgt.hurtT=0.15;
  spawnParts(tgt.x,tgt.y-16,4,"#f2e6c8",120,300,0.35,2.6);
  let sname="hit";
  if(att){ if(tgt.w) sname="building_hit";
    else if(att.kind==="wolf") sname="wolf";
    else if(att.kind==="cultist") sname="cultist_atk";
    else if(att.type==="hero") sname="slash";
    else if(ranged) sname="bow"; }
  else sname="bow";
  sfx(sname);
  if(!ranged) shake(1.4);
  if(!ranged&&att) slashFx.push({x:tgt.x,y:tgt.y-16,ang:Math.atan2(tgt.y-att.y,tgt.x-att.x),t:0});
}
function moveTo(o,tx,ty,dt,stopD){
  const dx=tx-o.x, dy=ty-o.y, d=Math.hypot(dx,dy);
  if(d>Math.max(1,stopD)){ o.x+=dx/d*o.spd*dt; o.y+=dy/d*o.spd*dt; o.face=dx>=0?1:-1; o.moving=true; o.walkT=(o.walkT||0)+dt;
    if(Math.random()<dt*5) spawnParts(o.x,o.y+2,1,"rgba(186,168,128,.5)",26,80,0.4,2.4); }
}
function showOverlay(title,text,btnTxt,btnFn){
  $("ovTitle").textContent=title; $("ovText").textContent=text;
  $("ovBtns").innerHTML='<button onclick="'+btnFn+'">'+btnTxt+'</button><button onclick="retryLevel()">重玩本关</button>';
  $("overlay").style.display="flex";
}
function nextLevel(){ if(level===1) startLevel(2); else startLevel(1); }

// ============ 渲染 ============
function shadow(x,y,rx,ry){
  ctx.fillStyle="rgba(20,44,16,.10)"; ctx.beginPath(); ctx.ellipse(x,y,rx*1.35,ry*1.35,0,0,7); ctx.fill();
  ctx.fillStyle="rgba(20,44,16,.22)"; ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,7); ctx.fill();
}
function hpBar(x,y,w,h,ratio,col){
  ratio=Math.max(0,Math.min(1,ratio));
  ctx.fillStyle="rgba(10,14,10,.75)"; ctx.fillRect(x-1,y-1,w+2,h+2);
  ctx.fillStyle=col; ctx.fillRect(x,y,w*ratio,h);
  ctx.fillStyle="rgba(255,255,255,.32)"; ctx.fillRect(x,y,w*ratio,1.3);
  ctx.strokeStyle="rgba(0,0,0,.55)"; ctx.lineWidth=1; ctx.strokeRect(x-0.5,y-0.5,w+1,h+1);
}
function drawWolf(e){
  const s=50; let bobY, rot=0, sc=1, ox=0;
  shadow(e.x,e.y+5,s*0.32,s*0.12);
  if(e.moving){ bobY=-Math.abs(Math.sin((e.walkT||0)*13))*3; rot=Math.sin((e.walkT||0)*13+1.2)*0.07; }
  else bobY=Math.sin(performance.now()/420+e.hx)*1.5;
  if(e.lungeT>0){ const k=Math.sin((0.18-e.lungeT)/0.18*Math.PI); ox=(e.lungeDx||0)*k; bobY+=(e.lungeDy||0)*k; rot-=0.18*k; }
  if(e.atkPulseT>0){ const p=Math.sin((0.18-e.atkPulseT)/0.18*Math.PI); sc=1+0.12*p; }
  ctx.save(); ctx.translate(e.x+ox,e.y+bobY); ctx.rotate(rot); if(e.face>0)ctx.scale(-1,1); ctx.scale(sc,sc);
  if(e.hurtT>0) ctx.filter="brightness(1.75) saturate(.45)";
  ctx.drawImage(baked(IMGS["10_wolf"],s,s),-s/2,-s+10,s,s);
  ctx.filter="none"; ctx.restore();
}
function drawSprite(e,s){
  const now=performance.now()/1000;
  shadow(e.x,e.y+4,s*0.30,s*0.11);
  let bobY, rot=0, sc=1, ox=0;
  if(e.moving){ bobY=Math.sin((e.walkT||0)*16)*2.5; rot=Math.sin((e.walkT||0)*16+1.6)*0.06; }
  else bobY=Math.sin(now*2.2+(e.animT||0))*1.2;
  if(e.lungeT>0){ const k=Math.sin((0.18-e.lungeT)/0.18*Math.PI); ox=(e.lungeDx||0)*k; bobY+=(e.lungeDy||0)*k; }
  if(e.atkPulseT>0){ const p=Math.sin((0.18-e.atkPulseT)/0.18*Math.PI); sc=1+0.13*p; rot+=((e.lungeDx||0)>=0?1:-1)*0.2*p; }
  ctx.save(); ctx.translate(e.x+ox,e.y+bobY); ctx.rotate(rot); if(e.face<0)ctx.scale(-1,1); ctx.scale(sc,sc);
  if(e.hurtT>0) ctx.filter="brightness(1.75) saturate(.45)";
  ctx.drawImage(baked(IMGS[e.img],s,s),-s/2,-s+6,s,s);
  ctx.filter="none"; ctx.restore();
}

    ctx.strokeStyle="rgba(57,211,83,.45)"; ctx.lineWidth=4.5; ctx.beginPath(); ctx.ellipse(s.x,s.y+4,rr2,rr2*0.45,0,0,7); ctx.stroke();
    ctx.strokeStyle="#39d353"; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(s.x,s.y+4,rr2,rr2*0.45,0,0,7); ctx.stroke(); }
  if(dragStart&&mouse.x){ const x1=Math.min(dragStart.x,mouse.x),x2=Math.max(dragStart.x,mouse.x),y1=Math.min(dragStart.y,mouse.y),y2=Math.max(dragStart.y,mouse.y);
    ctx.fillStyle="rgba(57,211,83,.14)"; ctx.fillRect(x1,y1,x2-x1,y2-y1);
    ctx.strokeStyle="#39d353"; ctx.lineWidth=1.5; ctx.setLineDash([5,4]); ctx.strokeRect(x1,y1,x2-x1,y2-y1); ctx.setLineDash([]); }
  if(selList.length&&mouse.x){ ctx.strokeStyle="rgba(57,211,83,.5)"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(mouse.x,mouse.y,8,0,7); ctx.stroke(); }
  const hero=units.find(u=>u.type==="hero");
  if(hero&&hero.whirlFx>0){ hero.whirlFx-=0.016; ctx.strokeStyle="rgba(80,150,255,"+Math.max(0,hero.whirlFx*2)+")"; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(hero.x,hero.y-14,CFG.whirlR*(1-hero.whirlFx*1.2),0,7); ctx.stroke(); }
  for(const p of projs){ const t=Math.min(1,p.t), ix=p.x+(p.x2-p.x)*t, iy=p.y+(p.y2-p.y)*t;
    ctx.strokeStyle="rgba(138,90,42,.40)"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(ix-12,iy+1.5); ctx.lineTo(ix-4,iy); ctx.stroke();
    ctx.strokeStyle="#5e3c1c"; ctx.lineWidth=2.6; ctx.beginPath(); ctx.moveTo(ix-6,iy); ctx.lineTo(ix+6,iy); ctx.stroke(); }
  for(const s of slashFx){ const k=1-s.t;
    ctx.strokeStyle="rgba(255,238,170,"+(k*0.5).toFixed(2)+")"; ctx.lineWidth=6.5; ctx.lineCap="round";
    ctx.beginPath(); ctx.arc(s.x,s.y,15,s.ang-1.1+k*1.4,s.ang-0.2+k*1.4); ctx.stroke();
    ctx.strokeStyle="rgba(255,255,255,"+(k*0.95).toFixed(2)+")"; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(s.x,s.y,15,s.ang-1.1+k*1.4,s.ang-0.2+k*1.4); ctx.stroke(); ctx.lineCap="butt"; }
  for(const m of moveMarks){ const k=m.t/0.5;
    ctx.strokeStyle=m.col; ctx.globalAlpha=1-k; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.ellipse(m.x,m.y,5+k*20,(5+k*20)*0.45,0,0,7); ctx.stroke();
    ctx.fillStyle=m.col; ctx.beginPath(); ctx.arc(m.x,m.y,2.5,0,7); ctx.fill(); ctx.globalAlpha=1; }
  for(const s of sparkles){ const k=Math.sin(Math.min(1,s.t/0.9)*Math.PI), r=4+k*4;
    ctx.strokeStyle="rgba(255,240,150,"+(k*0.95).toFixed(2)+")"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(s.x-r,s.y); ctx.lineTo(s.x+r,s.y); ctx.moveTo(s.x,s.y-r); ctx.lineTo(s.x,s.y+r); ctx.stroke();
    ctx.fillStyle="rgba(255,255,220,"+(k*0.9).toFixed(2)+")"; ctx.beginPath(); ctx.arc(s.x,s.y,1.6+k,0,7); ctx.fill(); }
  for(const p of parts){ ctx.globalAlpha=Math.max(0,1-p.t/p.life); ctx.fillStyle=p.col;
    ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size); ctx.globalAlpha=1; }
  for(const f of floats){ ctx.globalAlpha=Math.max(0,1-f.t);
    const sc2=f.t<0.18?(0.65+0.5*(f.t/0.18)):1;
    ctx.font="bold "+Math.round(14*sc2)+"px sans-serif"; ctx.textAlign="center"; ctx.strokeStyle="rgba(255,255,255,.85)"; ctx.lineWidth=3.5; ctx.strokeText(f.text,f.x,f.y);     ctx.fillStyle=f.color; ctx.fillText(f.text,f.x,f.y); ctx.globalAlpha=1; }
  ctx.restore();
  if(LEVELS[level].night){ ctx.fillStyle="rgba(16,20,60,.38)"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#f5f2d8"; ctx.beginPath(); ctx.arc(842,74,26,0,7); ctx.fill();
    ctx.fillStyle="rgba(16,20,60,.38)"; ctx.beginPath(); ctx.arc(852,66,22,0,7); ctx.fill(); }
  ctx.drawImage(vig,0,0);
}

// ============ HUD ============
function banner(txt){ const b=$("banner"); b.textContent=txt; b.classList.remove("show"); void b.offsetWidth; b.classList.add("show"); }
const lastRes={};
function hud(){
  $("rWood").textContent=res.wood; $("rFood").textContent=res.food; $("rStone").textContent=res.stone; $("rGold").textContent=res.gold;
  for(const k of ["wood","food","stone","gold"]){ const el=$("r"+k[0].toUpperCase()+k.slice(1));
    if(lastRes[k]!==undefined&&lastRes[k]!==res[k]){ el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
    lastRes[k]=res[k]; }
  $("rPop").textContent=popUsed()+"/"+popCap;
  $("heroCd").textContent= heroCd>0 ? "旋风斧：CD "+heroCd.toFixed(1)+"s" : "旋风斧：就绪";
  const hasB=buildings.some(b=>b.type==="barracks");
  setCard("cFarmer", res.food>=50 && popUsed()<popCap);
  setCard("cHouse", res.wood>=80);
  setCard("cBarracks", res.wood>=150 && !hasB);
  setCard("cArcher", hasB && res.wood>=45&&res.gold>=40 && popUsed()<popCap);
  setCard("cTower", res.stone>=150);
  setCard("cWall", res.stone>=30);
  setCard("cSkill", heroCd<=0 && units.some(u=>u.type==="hero"));
  const pmap={house:"cHouse",barracks:"cBarracks",tower:"cTower"};
  for(const k in pmap) $(pmap[k]).style.outline=(placing&&placing.type===k)?"3px solid #39d353":"none";
  const popSpan=$("rPop"), popRatio=popUsed()/popCap;
  popSpan.style.color = popRatio>=1 ? "#c22" : popRatio>=0.8 ? "#d80" : "";
  const L2=LEVELS[level];
  if(L2.waves&&waveIdx<L2.waves.length){
    $("nextWave").style.display="inline";
    $("nextWave").textContent="下波 "+Math.max(0,Math.ceil(L2.waves[waveIdx].at-waveT))+"s";
  } else $("nextWave").style.display="none";
}
function setCard(id,ok){ const el=$(id); el.classList.toggle("off",!ok); if(!ok){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); } }

// ============ 新手引导（仅 1-1）============
let tutorStep = 1, tutorHold=0;
function tutor(dt){
  const el=$("tutor");
  if(!settings.tutor||level!==1||gameOver||tutorStep>3){ el.style.display="none"; return; }
  if(tutorStep===1 && selList.some(u=>u.type==="farmer")){ tutorStep=2; }
  if(tutorStep===2 && units.some(u=>u.type==="farmer"&&u.state==="gather")){ tutorStep=3; tutorHold=3.5; }
  if(tutorStep===1) el.textContent="① 左键点选一个农民（草帽小人，脚下出现绿圈）";
  else if(tutorStep===2) el.textContent="② 左键点击树木 / 浆果 / 金矿 → 农民自动开采";
  else el.textContent="③ 采集自动循环入账 → 造农民扩张经济，清光野狼获胜！";
  el.style.display="block";
  if(tutorStep===3){ tutorHold-=dt; if(tutorHold<=0) tutorStep=99; }
}

// ============ 设置 + 音效（WebAudio 合成，零素材）============
let settings={sound:true,floats:true,bars:"all",tutor:true,speed:1};
try{ Object.assign(settings, JSON.parse(localStorage.getItem("isle_settings")||"{}")); }catch(err){}
function saveSettings(){ try{ localStorage.setItem("isle_settings", JSON.stringify(settings)); }catch(err){} }
let AC=null;
function beep(f,t,type,vol,delay){
  if(!settings.sound) return;
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(err){ return; } }
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(vol||0.04, AC.currentTime+delay);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+delay+t);
  o.connect(g); g.connect(AC.destination); o.start(AC.currentTime+delay); o.stop(AC.currentTime+delay+t);
}
function noiseBurst(t,vol,delay,cutoff){
  if(!settings.sound) return;
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(err){ return; } }
  const b=AC.createBuffer(1,Math.max(1,Math.floor(AC.sampleRate*t)),AC.sampleRate);
  const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const src=AC.createBufferSource(); src.buffer=b;
  const f=AC.createBiquadFilter(); f.type="lowpass"; f.frequency.value=cutoff||800;
  const g=AC.createGain();
  g.gain.setValueAtTime(vol||0.04, AC.currentTime+delay);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+delay+t);
  src.connect(f); f.connect(g); g.connect(AC.destination); src.start(AC.currentTime+delay);
}
function sweepTone(f1,f2,t,type,vol,delay){
  if(!settings.sound) return;
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(err){ return; } }
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f1, AC.currentTime+delay);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,f2), AC.currentTime+delay+t);
  g.gain.setValueAtTime(vol||0.04, AC.currentTime+delay);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+delay+t);
  o.connect(g); g.connect(AC.destination); o.start(AC.currentTime+delay); o.stop(AC.currentTime+delay+t);
}
function sfx(name){
  if(name==="hit"){ noiseBurst(0.07,0.05,0,900); beep(150,0.06,"square",0.03,0); }
  else if(name==="slash"){ noiseBurst(0.09,0.055,0,1500); sweepTone(300,140,0.08,"square",0.03,0); }
  else if(name==="bow"){ beep(980,0.05,"sine",0.03,0); noiseBurst(0.05,0.02,0,2600); }
  else if(name==="tower_shot"){ beep(720,0.06,"sine",0.03,0); noiseBurst(0.06,0.025,0,1800); }
  else if(name==="cultist_atk"){ beep(95,0.11,"sawtooth",0.05,0); noiseBurst(0.08,0.03,0,420); }
  else if(name==="wolf"){ beep(110,0.12,"sawtooth",0.05,0); noiseBurst(0.09,0.03,0,700); }
  else if(name==="die_enemy"){ sweepTone(180,65,0.2,"sawtooth",0.05,0); noiseBurst(0.18,0.05,0.03,500); }
  else if(name==="die_ally"){ sweepTone(260,95,0.28,"triangle",0.055,0); noiseBurst(0.22,0.06,0.06,340); }
  else if(name==="whirl"){ sweepTone(280,880,0.24,"sawtooth",0.04,0); noiseBurst(0.26,0.035,0,2000); }
  else if(name==="place"){ beep(500,0.05,"sine",0.035,0); noiseBurst(0.05,0.03,0,900); }
  else if(name==="hammer"){ noiseBurst(0.06,0.05,0,650); beep(180,0.06,"square",0.03,0.01); }
  else if(name==="building_hit"){ noiseBurst(0.1,0.05,0,340); beep(85,0.08,"sawtooth",0.03,0); }
  else if(name==="building_down"){ noiseBurst(0.55,0.09,0,240); sweepTone(90,40,0.45,"sawtooth",0.07,0); }
  else if(name==="gather") beep(880,0.06,"sine",0.035,0);
  else if(name==="build"){ beep(523,0.08,"sine",0.04,0); beep(784,0.1,"sine",0.04,0.09); noiseBurst(0.08,0.02,0.02,1200); }
  else if(name==="win"){ beep(523,0.12,"triangle",0.055,0); beep(659,0.12,"triangle",0.055,0.13); beep(784,0.3,"triangle",0.055,0.26); }
  else if(name==="lose"){ beep(320,0.2,"sawtooth",0.05,0); beep(210,0.4,"sawtooth",0.05,0.2); }
  else if(name==="click") beep(660,0.04,"sine",0.025,0);
}
const SPEEDS=[1,1.5,2];
function syncPanel(){
  $("bSpeed").textContent=settings.speed+"x";
  $("bSound").textContent=settings.sound?"开":"关";
  $("bFloats").textContent=settings.floats?"开":"关";
  $("bBars").textContent={all:"全部",hurt:"受伤时",off:"隐藏"}[settings.bars];
  $("bTutor").textContent=settings.tutor?"开":"关";
}
$("gearBtn").onclick=()=>{ sfx("click"); syncPanel(); $("settings").style.display="flex"; };
// 全屏切换（Fullscreen API）
$("fsBtn").onclick=()=>{ sfx("click");
  if(!document.fullscreenElement){ (document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen())||0; }
  else if(document.exitFullscreen){ document.exitFullscreen(); } };
document.addEventListener("fullscreenchange",()=>{
  $("fsBtn").textContent=document.fullscreenElement?"⤢":"⛶";

});
$("sClose").onclick=()=>{ sfx("click"); $("settings").style.display="none"; };
$("sReplay").onclick=()=>{ $("settings").style.display="none"; retryLevel(); };
$("bSpeed").onclick=()=>{ settings.speed=SPEEDS[(SPEEDS.indexOf(settings.speed)+1)%SPEEDS.length]; saveSettings(); syncPanel(); };

$("bFloats").onclick=()=>{ settings.floats=!settings.floats; saveSettings(); syncPanel(); };
$("bBars").onclick=()=>{ settings.bars={all:"hurt",hurt:"off",off:"all"}[settings.bars]; saveSettings(); syncPanel(); };
$("bTutor").onclick=()=>{ settings.tutor=!settings.tutor; saveSettings(); syncPanel(); };
function barOn(e){ if(settings.bars==="off") return false; if(settings.bars==="hurt") return e.hp<e.maxHp; return true; }

// ============ 一键指令（采集/全军出击）============
function nearestNode(kind,u){
  let best=null, nd=1e9;
  for(const n of nodes){ if(n.amt<=0||n.kind!==kind) continue; const d=dist2(u.x,u.y,n.x,n.y); if(d<nd){nd=d;best=n;} }
  return best;
}
function commandGather(kind){
  if(gameOver) return;
  const fs=units.filter(u=>u.type==="farmer");
  if(!fs.length) return flash("没有农民，先造一个");
  const labels={wood:"伐木",food:"采食",stone:"采石",gold:"挖金"};
  let sent=0;
  for(const f of fs){ const n=nearestNode(kind,f); if(n){ f.node=n; f.state="gather"; f.target=null; f.dest=null; sent++; } }
  if(!sent) return flash("地图上没有可采的"+{wood:"树木",food:"浆果",stone:"石头",gold:"金矿"}[kind]);
  addFloat(W/2,110,"全体农民 → "+labels[kind],"#185FA5"); sfx("click");
}
function commandAttack(){
  if(gameOver) return;
  const ts=units.filter(u=>u.type==="archer"||u.type==="hero");
  if(!ts.length) return flash("没有战斗单位");
  if(!enemies.length) return flash("视野内没有敌人");
  for(const t of ts){ let near=null,nd=1e9;
    for(const e of enemies){ const d=dist2(t.x,t.y,e.x,e.y); if(d<nd){nd=d;near=e;} }
    if(near){ t.target=near; t.state="attack"; t.node=null; t.dest=null; } }
  addFloat(W/2,110,"全军出击！","#c33333"); sfx("click");
}
$("mWood").onclick=()=>commandGather("wood");
$("mFood").onclick=()=>commandGather("food");
$("mStone").onclick=()=>commandGather("stone");
$("mGold").onclick=()=>commandGather("gold");
$("mAtk").onclick=()=>commandAttack();
$("cWall").onclick=()=>tryBuild("wall");

function loop(now){
  const dt=Math.min(0.05,(now-last)/1000)*settings.speed; last=now;
  update(dt); render(); hud(); tutor();
  requestAnimationFrame(loop);
}

loadAssets().then(()=>{ drawMountains(); startLevel([1,2].includes(urlLevel)?urlLevel:1); requestAnimationFrame(loop); });

if(new URLSearchParams(location.search).get("autotest")){

    tryBuild("house");
    setTimeout(()=>{
      const r=cv.getBoundingClientRect();
      const ev=(t,x,y)=>new MouseEvent(t,{clientX:r.left+x*r.width/W,clientY:r.top+y*r.height/H,button:0,bubbles:true});

      cv.dispatchEvent(ev("mousedown",700,300));

        d.textContent="放置自检: -> ("+after+") "+(ok?"通过":"失败");
        document.body.appendChild(d);

      },400);
